name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (1.6 + 1.7)
        run: dotnet build Source/GenderedBeds/GenderedBeds.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: GenderedBeds
          path: |
            About/
            Common/
            1.6/
            1.7/
            loadFolders.xml
